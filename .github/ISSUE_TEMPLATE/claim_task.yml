name: 🙋 Claim a Task / Feature
description: Claim an open Stellar Drips Wave task or propose a feature
title: "[CLAIM] <Task Title>"
labels: ["help-wanted"]
body:
  - type: textarea
    id: motivation
    attributes:
      label: Motivation & Proposed Implementation
      description: Explain how you plan to implement this task.
      placeholder: I would like to work on this task by implementing...
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Contributor Checklist
      options:
        - label: I will follow conventional commit messages (e.g. feat:, fix:, docs:)
          required: true
        - label: I will write unit tests for my changes (cargo test --all --features testutils)
          required: true

