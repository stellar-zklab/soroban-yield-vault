name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts (Build & Test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for committed secrets or leftover local artifacts
        run: bash scripts/check-source-artifacts.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, pinned 2026-09-17
        with:
          targets: wasm32v1-none
          components: clippy, rustfmt

      - name: Pin transitive ed25519 dependencies
        run: |
          cargo generate-lockfile
          cargo update -p ed25519-dalek:3.0.0 --precise 2.1.1 || true
          cargo update -p ed25519:3.0.0 --precise 2.2.3 || true

      - name: Build WASM release
        run: cargo build --release --target wasm32v1-none

      - name: Run unit tests
        run: cargo test --all --features testutils
